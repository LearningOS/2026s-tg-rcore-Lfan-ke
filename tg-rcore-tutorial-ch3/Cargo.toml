[package]
name = "tg-rcore-tutorial-ch3"
description = "Chapter 3 of rCore Tutorial: Multiprogramming and time-sharing multitasking."
version = "0.4.10"
edition = "2024"
authors = ["YdrMaster <ydrml@hotmail.com>","Yifan Wang<w-yf22@mails.tsinghua.edu.cn>","Yu Chen <yuchen@tsinghua.edu.cn>"]
repository = "https://github.com/rcore-os/tg-rcore-tutorial-ch3"
homepage = "https://github.com/rcore-os/tg-rcore-tutorial-ch3/tree/test"
documentation = "https://docs.rs/tg-rcore-tutorial-ch3"
license = "GPL-3.0"
readme = "README.md"
keywords = ["rcore", "tutorial", "no-std", "riscv", "multitasking"]
categories = ["no-std", "embedded"]
exclude = [
    "tg-rcore-tutorial-user/**",
#    ".cargo/config.toml",
]

[features]
coop = []
exercise = []
# 用户态图形贪吃蛇（VirtIO-GPU 帧缓冲 + UART 非阻塞键盘）。
# 开启后 rust_main 初始化 GPU（静态 DMA 池）并接通自定义 syscall 2000/2001/2002，
# 同时 build.rs 改用 cases.toml 的 [ch3_game] 用例集（含 snake）。
# 本章 satp=Bare（无分页），帧缓冲物理地址即用户可直接访问的地址，无需映射。
game = ["dep:spin", "dep:virtio-drivers"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
riscv = "0.10.1"
spin = { version = "0.9", optional = true }
virtio-drivers = { version = "0.1.0", optional = true }

tg-sbi = { package = "tg-rcore-tutorial-sbi", path = "../tg-rcore-tutorial-sbi", version = "0.4.9", features = ["nobios"] }
tg-linker = { package = "tg-rcore-tutorial-linker", path = "../tg-rcore-tutorial-linker", version = "0.4.8" }
tg-console = { package = "tg-rcore-tutorial-console", path = "../tg-rcore-tutorial-console", version = "0.4.8" }
tg-kernel-context = { package = "tg-rcore-tutorial-kernel-context", path = "../tg-rcore-tutorial-kernel-context", version = "0.4.8" }
tg-syscall = { package = "tg-rcore-tutorial-syscall", path = "../tg-rcore-tutorial-syscall", version = "0.4.8", features = ["kernel"] }

[build-dependencies]
tg-linker = { package = "tg-rcore-tutorial-linker", path = "../tg-rcore-tutorial-linker", version = "0.4.8" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"